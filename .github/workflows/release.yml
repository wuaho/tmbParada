name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TMB_APP_ID: ${{ secrets.TMB_APP_ID }}
      TMB_APP_KEY: ${{ secrets.TMB_APP_KEY }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Check secrets
        run: |
          missing=""
          for name in TMB_APP_ID TMB_APP_KEY RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see Releases in README.md)"
            exit 1
          fi
      - name: Decode keystore
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Unit tests
        run: ./gradlew testReleaseUnitTest
      - name: Assemble release APK
        run: ./gradlew assembleRelease
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="2.0.${VERSION_CODE}"
          apk="tmb-stop-${version}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "v${version}" "$apk" \
            --title "TMB Stop ${version}" \
            --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)" \
            --target "$GITHUB_SHA"
